<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ふたりの未来リスト</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --primary-soft: #eef2ff;
      --accent: #2563eb;
      --danger: #dc2626;
      --success: #059669;
      --warning: #d97706;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 96px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(246, 247, 251, 0.92);
      backdrop-filter: blur(10px);
      padding: 16px 16px 10px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .account-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .account-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
      max-width: 220px;
    }

    .account-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .account-dot.logged-in {
      background: var(--success);
    }

    .account-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .account-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: min(320px, 82vw);
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    .account-email {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .stack-sm { display: grid; gap: 8px; }

    .content {
      padding: 10px 16px 0;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .card,
    .panel,
    .empty-state,
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .section-note {
      margin: -2px 0 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn,
    .secondary-btn,
    .danger-btn,
    .primary-btn,
    .ghost-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .primary-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
    }

    .secondary-btn,
    .ghost-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .danger-btn {
      background: var(--danger);
      color: #fff;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-group {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="url"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .inline-actions,
    .card-actions,
    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .inline-actions > button,
    .card-actions > button,
    .modal-actions > button {
      flex: 1 1 140px;
    }

    .status {
      min-height: 1.4em;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .status.warning { color: var(--warning); }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #f3f4f6;
      color: #374151;
    }

    .pill.primary {
      background: var(--primary-soft);
      color: #3730a3;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.45;
      word-break: break-word;
    }

    .card-text {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card-link {
      display: block;
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      z-index: 30;
    }

    .nav-btn {
      border: none;
      background: transparent;
      padding: 10px 4px 12px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    .fab {
      position: fixed;
      right: max(16px, calc((100vw - min(760px, 100vw)) / 2 + 16px));
      bottom: 74px;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 40;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-card {
      width: min(420px, 100%);
      padding: 18px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 800;
    }

    .modal-note {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    .action-choice {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .action-choice strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .action-choice span {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .auth-only {
      max-width: 560px;
      margin: 26px auto 0;
    }

    .small-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      h1 { font-size: 23px; }
      .topbar { padding-inline: 12px; }
      .content { padding-inline: 12px; }
      .account-btn { max-width: 135px; }
      .fab { right: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>ふたりの未来リスト</h1>
          <div class="subtitle">行きたい場所とライフプランをまとめて管理</div>
        </div>
        <div class="account-wrap">
          <button id="accountBtn" class="account-btn hidden" type="button" aria-label="アカウントメニューを開く">
            <span id="accountDot" class="account-dot"></span>
            <span id="accountLabel" class="account-label">未ログイン</span>
          </button>
          <div id="accountMenu" class="account-menu hidden">
            <div id="accountEmail" class="account-email">ログインしていません</div>
            <div class="stack-sm">
              <button id="reloadBtn" class="secondary-btn" type="button">Supabaseから再読み込み</button>
              <button id="logoutBtn" class="danger-btn" type="button">ログアウト</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <section id="authPanel" class="panel auth-only">
        <h2 class="section-title">ログイン</h2>
        <p class="section-note">メール認証でログインします。受け取ったコードを入力してください。</p>
        <div class="form-grid">
          <div class="form-group">
            <label for="emailInput">メールアドレス</label>
            <input id="emailInput" type="email" placeholder="example@example.com" />
          </div>
          <button id="loginBtn" class="primary-btn" type="button">認証コードを送信</button>
          <div id="otpPanel" class="hidden">
            <div class="form-group">
              <label for="otpInput">認証コード</label>
              <input id="otpInput" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="8桁コード" maxlength="8" />
            </div>
            <button id="verifyBtn" class="primary-btn" type="button">コードを確認してログイン</button>
          </div>
        </div>
        <div id="authStatus" class="status"></div>
      </section>

      <section id="appPanel" class="hidden">
        <section id="screen-places" class="screen active">
          <section class="panel">
            <h2 id="placeFormTitle" class="section-title">行きたい場所を追加</h2>
            <div class="form-grid">
              <div class="form-group">
                <label for="placeNameInput">店名・場所名</label>
                <input id="placeNameInput" type="text" placeholder="例：神楽坂のイタリアン" />
              </div>
              <div class="form-group">
                <label for="placeUrlInput">URL</label>
                <input id="placeUrlInput" type="url" placeholder="https://example.com" />
              </div>
              <div class="form-group">
                <label for="placeCategoryInput">カテゴリ</label>
                <select id="placeCategoryInput">
                  <option value="食">食</option>
                  <option value="旅行">旅行</option>
                </select>
              </div>
              <div class="inline-actions">
                <button id="savePlaceBtn" class="primary-btn" type="button">追加する</button>
                <button id="cancelPlaceEditBtn" class="secondary-btn hidden" type="button">編集をキャンセル</button>
              </div>
            </div>
            <div class="small-note">保存先は Supabase の items テーブルです。</div>
            <div id="placeStatus" class="status"></div>
          </section>

          <section class="panel">
            <h2 class="section-title">一覧</h2>

            <div class="tabs">
              <button class="tab-btn active" id="placeCategoryAllBtn" type="button">すべて</button>
              <button class="tab-btn" id="placeCategoryFoodBtn" type="button">食</button>
              <button class="tab-btn" id="placeCategoryTravelBtn" type="button">旅行</button>
            </div>

            <div class="tabs">
              <button class="tab-btn active" id="placeVisitWantBtn" type="button">行きたい</button>
              <button class="tab-btn" id="placeVisitDoneBtn" type="button">行った</button>
            </div>

<div class="pill-row" style="margin-bottom:12px;">
  <span class="pill">食 行きたい: <span id="summaryFoodWant" style="margin-left:4px;">0</span></span>
  <span class="pill">食 行った: <span id="summaryFoodDone" style="margin-left:4px;">0</span></span>
  <span class="pill">旅行 行きたい: <span id="summaryTravelWant" style="margin-left:4px;">0</span></span>
  <span class="pill">旅行 行った: <span id="summaryTravelDone" style="margin-left:4px;">0</span></span>
</div>

            <section id="placesList" class="list"></section>
          </section>
        </section>

        <section id="screen-plans" class="screen">
          <section class="panel">
            <h2 id="planFormTitle" class="section-title">ライフプランを追加</h2>
            <div class="form-grid">
              <div class="form-group">
                <label for="planTitleInput">やりたいこと</label>
                <input id="planTitleInput" type="text" placeholder="例：30代でヨーロッパ旅行" />
              </div>
              <div class="form-group">
                <label for="planAgeInput">年代</label>
                <select id="planAgeInput">
                  <option value="20代">20代</option>
                  <option value="30代">30代</option>
                  <option value="40代">40代</option>
                  <option value="50代">50代</option>
                  <option value="60代+">60代+</option>
                </select>
              </div>
              <div class="form-group">
                <label for="planCategoryInput">カテゴリ</label>
                <select id="planCategoryInput">
                  <option value="旅行">旅行</option>
                  <option value="暮らし">暮らし</option>
                  <option value="家族">家族</option>
                  <option value="仕事">仕事</option>
                  <option value="お金">お金</option>
                  <option value="健康">健康</option>
                  <option value="趣味">趣味</option>
                </select>
              </div>
              <div class="form-group">
                <label for="planOwnerInput">対象</label>
                <select id="planOwnerInput">
                  <option value="shared">共通</option>
                  <option value="male">彼氏</option>
                  <option value="female">彼女</option>
                </select>
              </div>
              <div class="form-group">
                <label for="planStatusInput">状態</label>
                <select id="planStatusInput">
                  <option value="idea">いつか</option>
                  <option value="planning">検討中</option>
                  <option value="active">進行中</option>
                  <option value="done">達成</option>
                </select>
              </div>
              <div class="form-group">
                <label for="planPriorityInput">優先度</label>
                <select id="planPriorityInput">
                  <option value="3">高</option>
                  <option value="2" selected>中</option>
                  <option value="1">低</option>
                </select>
              </div>
              <div class="form-group">
                <label for="planNoteInput">メモ</label>
                <textarea id="planNoteInput" placeholder="背景や補足をメモ"></textarea>
              </div>
              <div class="inline-actions">
                <button id="savePlanBtn" class="primary-btn" type="button">追加する</button>
                <button id="cancelPlanEditBtn" class="secondary-btn hidden" type="button">編集をキャンセル</button>
              </div>
            </div>
            <div class="small-note">保存先は Supabase の life_plans テーブルです。</div>
            <div id="planStatus" class="status"></div>
          </section>

          <section class="panel">
            <h2 class="section-title">一覧</h2>

            <div class="tabs">
              <button class="tab-btn active" data-age-filter="all" type="button">すべて</button>
              <button class="tab-btn" data-age-filter="20代" type="button">20代</button>
              <button class="tab-btn" data-age-filter="30代" type="button">30代</button>
              <button class="tab-btn" data-age-filter="40代" type="button">40代</button>
              <button class="tab-btn" data-age-filter="50代" type="button">50代</button>
              <button class="tab-btn" data-age-filter="60代+" type="button">60代+</button>
            </div>

            <div class="tabs">
              <button class="tab-btn active" data-owner-filter="all" type="button">すべて</button>
              <button class="tab-btn" data-owner-filter="shared" type="button">共通</button>
              <button class="tab-btn" data-owner-filter="male" type="button">彼氏</button>
              <button class="tab-btn" data-owner-filter="female" type="button">彼女</button>
            </div>

            <section id="plansList" class="list"></section>
          </section>
        </section>
      </section>
    </main>

    <button id="fab" class="fab hidden" type="button" aria-label="追加する">＋</button>

    <nav id="bottomNav" class="bottom-nav hidden">
      <button class="nav-btn active" data-screen="places" type="button">
        <span class="nav-icon">📍</span>
        <span>行きたい</span>
      </button>
      <button class="nav-btn" data-screen="plans" type="button">
        <span class="nav-icon">🗂</span>
        <span>ライフプラン</span>
      </button>
    </nav>
  </div>

  <div id="fabModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 class="modal-title">追加する内容を選択</h3>
      <p class="modal-note">項目の性質が違うため、追加フォームは分けています。</p>
      <button id="openPlaceFormBtn" class="action-choice" type="button">
        <strong>行きたい場所を追加</strong>
        <span>店、スポット、旅行先を登録します。</span>
      </button>
      <button id="openPlanFormBtn" class="action-choice" type="button">
        <strong>ライフプランを追加</strong>
        <span>年代ごとの目標や将来やりたいことを登録します。</span>
      </button>
      <div class="modal-actions">
        <button id="closeFabModalBtn" class="secondary-btn" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 class="modal-title">削除の確認</h3>
      <p id="deleteModalText" class="modal-note">この項目を削除しますか？</p>
      <div class="modal-actions">
        <button id="confirmDeleteBtn" class="danger-btn" type="button">削除する</button>
        <button id="cancelDeleteBtn" class="secondary-btn" type="button">キャンセル</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ここを自分の値に書き換えてください
    const SUPABASE_URL = "https://trsyyzgvwumwtgtxidhc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyc3l5emd2d3Vtd3RndHhpZGhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjgyNjgsImV4cCI6MjA5MjIwNDI2OH0.5gz0Ao1TOAE5WGxE0BYWdX6ROuOCaFwQd1FrcKF9Vxo";
    const SHARED_LIST_ID = "7d0098c6-0f04-495a-80f4-83643ac94582";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const state = {
      user: null,
      currentScreen: "places",
      places: [],
      plans: [],
      placeVisitFilter: "want",
      placeCategoryFilter: "all",
      planAgeFilter: "all",
      planOwnerFilter: "all",
      editingPlaceId: null,
      editingPlanId: null,
      deleteTarget: null,
      pendingEmail: ""
    };

    const $ = (id) => document.getElementById(id);

    const els = {
      authPanel: $("authPanel"),
      appPanel: $("appPanel"),
      authStatus: $("authStatus"),
      emailInput: $("emailInput"),
      loginBtn: $("loginBtn"),
      otpPanel: $("otpPanel"),
      otpInput: $("otpInput"),
      verifyBtn: $("verifyBtn"),

      accountBtn: $("accountBtn"),
      accountDot: $("accountDot"),
      accountLabel: $("accountLabel"),
      accountMenu: $("accountMenu"),
      accountEmail: $("accountEmail"),
      reloadBtn: $("reloadBtn"),
      logoutBtn: $("logoutBtn"),

      fab: $("fab"),
      bottomNav: $("bottomNav"),

summaryFoodWant: $("summaryFoodWant"),
summaryFoodDone: $("summaryFoodDone"),
summaryTravelWant: $("summaryTravelWant"),
summaryTravelDone: $("summaryTravelDone"),

      placeFormTitle: $("placeFormTitle"),
      placeNameInput: $("placeNameInput"),
      placeUrlInput: $("placeUrlInput"),
      placeCategoryInput: $("placeCategoryInput"),
      savePlaceBtn: $("savePlaceBtn"),
      cancelPlaceEditBtn: $("cancelPlaceEditBtn"),
      placeStatus: $("placeStatus"),
      placeCategoryAllBtn: $("placeCategoryAllBtn"),
      placeCategoryFoodBtn: $("placeCategoryFoodBtn"),
      placeCategoryTravelBtn: $("placeCategoryTravelBtn"),
      placeVisitWantBtn: $("placeVisitWantBtn"),
      placeVisitDoneBtn: $("placeVisitDoneBtn"),
      placesList: $("placesList"),

      planFormTitle: $("planFormTitle"),
      planTitleInput: $("planTitleInput"),
      planAgeInput: $("planAgeInput"),
      planCategoryInput: $("planCategoryInput"),
      planOwnerInput: $("planOwnerInput"),
      planStatusInput: $("planStatusInput"),
      planPriorityInput: $("planPriorityInput"),
      planNoteInput: $("planNoteInput"),
      savePlanBtn: $("savePlanBtn"),
      cancelPlanEditBtn: $("cancelPlanEditBtn"),
      planStatus: $("planStatus"),
      plansList: $("plansList"),

      fabModal: $("fabModal"),
      openPlaceFormBtn: $("openPlaceFormBtn"),
      openPlanFormBtn: $("openPlanFormBtn"),
      closeFabModalBtn: $("closeFabModalBtn"),

      deleteModal: $("deleteModal"),
      deleteModalText: $("deleteModalText"),
      confirmDeleteBtn: $("confirmDeleteBtn"),
      cancelDeleteBtn: $("cancelDeleteBtn")
    };

    const screenEls = {
      places: $("screen-places"),
      plans: $("screen-plans")
    };

    function setStatus(el, message = "", type = "") {
      el.textContent = message;
      el.className = "status" + (type ? ` ${type}` : "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeUrl(url) {
      const trimmed = String(url || "").trim();
      if (!trimmed) return "";
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    }

    function ownerLabel(value) {
      if (value === "shared") return "共通";
      if (value === "male") return "彼氏";
      if (value === "female") return "彼女";
      return value || "不明";
    }

    function statusLabel(value) {
      if (value === "idea") return "いつか";
      if (value === "planning") return "検討中";
      if (value === "active") return "進行中";
      if (value === "done") return "達成";
      return value || "不明";
    }

    function priorityLabel(value) {
      if (Number(value) === 3) return "高";
      if (Number(value) === 2) return "中";
      if (Number(value) === 1) return "低";
      return String(value ?? "");
    }

    function showLoggedOut() {
      state.user = null;
      state.places = [];
      state.plans = [];
      state.editingPlaceId = null;
      state.editingPlanId = null;
      els.authPanel.classList.remove("hidden");
      els.appPanel.classList.add("hidden");
      els.bottomNav.classList.add("hidden");
      els.fab.classList.add("hidden");
      els.accountBtn.classList.add("hidden");
      els.accountMenu.classList.add("hidden");
      renderAll();
    }

    function showLoggedIn(user) {
      state.user = user;
      els.authPanel.classList.add("hidden");
      els.appPanel.classList.remove("hidden");
      els.bottomNav.classList.remove("hidden");
      els.fab.classList.remove("hidden");
      els.accountBtn.classList.remove("hidden");
      els.accountDot.classList.add("logged-in");
      els.accountLabel.textContent = user.email || "ログイン中";
      els.accountEmail.textContent = `${user.email || ""}\nユーザーID: ${user.id || ""}`;
      switchScreen("places");
      renderAll();
    }

    function switchScreen(screen) {
      state.currentScreen = screen;
      Object.entries(screenEls).forEach(([key, el]) => {
        el.classList.toggle("active", key === screen);
      });
      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.screen === screen);
      });
    }

    function updatePlaceFilterTabs() {
      els.placeVisitWantBtn.classList.toggle("active", state.placeVisitFilter === "want");
      els.placeVisitDoneBtn.classList.toggle("active", state.placeVisitFilter === "done");
      els.placeCategoryAllBtn.classList.toggle("active", state.placeCategoryFilter === "all");
      els.placeCategoryFoodBtn.classList.toggle("active", state.placeCategoryFilter === "食");
      els.placeCategoryTravelBtn.classList.toggle("active", state.placeCategoryFilter === "旅行");
    }

    function updatePlanFilterTabs() {
      document.querySelectorAll("[data-age-filter]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.ageFilter === state.planAgeFilter);
      });
      document.querySelectorAll("[data-owner-filter]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.ownerFilter === state.planOwnerFilter);
      });
    }

    function updateFormTitles() {
      const placeEditing = !!state.editingPlaceId;
      const planEditing = !!state.editingPlanId;
      els.placeFormTitle.textContent = placeEditing ? "行きたい場所を編集" : "行きたい場所を追加";
      els.savePlaceBtn.textContent = placeEditing ? "更新する" : "追加する";
      els.cancelPlaceEditBtn.classList.toggle("hidden", !placeEditing);

      els.planFormTitle.textContent = planEditing ? "ライフプランを編集" : "ライフプランを追加";
      els.savePlanBtn.textContent = planEditing ? "更新する" : "追加する";
      els.cancelPlanEditBtn.classList.toggle("hidden", !planEditing);
    }

    function resetPlaceForm() {
      state.editingPlaceId = null;
      els.placeNameInput.value = "";
      els.placeUrlInput.value = "";
      els.placeCategoryInput.value = "食";
      updateFormTitles();
    }

    function resetPlanForm() {
      state.editingPlanId = null;
      els.planTitleInput.value = "";
      els.planAgeInput.value = "20代";
      els.planCategoryInput.value = "旅行";
      els.planOwnerInput.value = "shared";
      els.planStatusInput.value = "idea";
      els.planPriorityInput.value = "2";
      els.planNoteInput.value = "";
      updateFormTitles();
    }

    function getFilteredPlaces() {
      return state.places.filter((item) => {
        const visitMatch = state.placeVisitFilter === "want" ? !item.visited : !!item.visited;
        const categoryMatch = state.placeCategoryFilter === "all" ? true : item.category === state.placeCategoryFilter;
        return visitMatch && categoryMatch;
      });
    }

    function getFilteredPlans() {
      return state.plans.filter((item) => {
        const ageMatch = state.planAgeFilter === "all" ? true : item.age_group === state.planAgeFilter;
        const ownerMatch = state.planOwnerFilter === "all" ? true : item.owner_type === state.planOwnerFilter;
        return ageMatch && ownerMatch;
      });
    }

    function renderPlaces() {
      updatePlaceFilterTabs();

const foodWantCount = state.places.filter((item) => item.category === "食" && !item.visited).length;
const foodDoneCount = state.places.filter((item) => item.category === "食" && !!item.visited).length;
const travelWantCount = state.places.filter((item) => item.category === "旅行" && !item.visited).length;
const travelDoneCount = state.places.filter((item) => item.category === "旅行" && !!item.visited).length;

els.summaryFoodWant.textContent = String(foodWantCount);
els.summaryFoodDone.textContent = String(foodDoneCount);
els.summaryTravelWant.textContent = String(travelWantCount);
els.summaryTravelDone.textContent = String(travelDoneCount);

      const rows = getFilteredPlaces();
      if (rows.length === 0) {
        els.placesList.innerHTML = `<div class="empty-state">該当する行きたい場所がありません。</div>`;
        return;
      }

      els.placesList.innerHTML = rows.map((item) => `
        <article class="card">
          <div class="pill-row">
            <span class="pill">${escapeHtml(item.category || "未設定")}</span>
            <span class="pill primary">${item.visited ? "行った" : "行きたい"}</span>
          </div>
          <h3 class="card-title">${escapeHtml(item.name)}</h3>
          <a class="card-link" href="${escapeHtml(item.url || "#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.url || "URLなし")}</a>
          <div class="card-actions">
            <button class="secondary-btn" type="button" data-place-edit="${escapeHtml(item.id)}">編集</button>
            <button class="secondary-btn" type="button" data-place-toggle="${escapeHtml(item.id)}" data-next-visited="${item.visited ? "false" : "true"}">${item.visited ? "行きたいに戻す" : "行った"}</button>
            <button class="danger-btn" type="button" data-place-delete="${escapeHtml(item.id)}">削除</button>
          </div>
        </article>
      `).join("");
    }

    function renderPlans() {
      updatePlanFilterTabs();
      const rows = getFilteredPlans();
      if (rows.length === 0) {
        els.plansList.innerHTML = `<div class="empty-state">該当するライフプランがありません。</div>`;
        return;
      }
      els.plansList.innerHTML = rows.map((item) => `
        <article class="card">
          <div class="pill-row">
            <span class="pill">${escapeHtml(item.age_group || "")}</span>
            <span class="pill">${escapeHtml(item.category || "")}</span>
            <span class="pill">${escapeHtml(ownerLabel(item.owner_type))}</span>
            <span class="pill primary">${escapeHtml(statusLabel(item.status))}</span>
            <span class="pill">優先度 ${escapeHtml(priorityLabel(item.priority))}</span>
          </div>
          <h3 class="card-title">${escapeHtml(item.title)}</h3>
          <p class="card-text">${escapeHtml(item.note || "メモなし")}</p>
          <div class="card-actions">
            <button class="secondary-btn" type="button" data-plan-edit="${escapeHtml(item.id)}">編集</button>
            <button class="danger-btn" type="button" data-plan-delete="${escapeHtml(item.id)}">削除</button>
          </div>
        </article>
      `).join("");
    }

    function renderAll() {
      updateFormTitles();
      renderPlaces();
      renderPlans();
    }

    async function loadPlaces() {
      const { data, error } = await supabase
        .from("items")
        .select("id, name, url, visited, category, created_at")
        .eq("list_id", SHARED_LIST_ID)
        .order("created_at", { ascending: false });

      if (error) throw error;
      state.places = Array.isArray(data) ? data : [];
    }

    async function loadPlans() {
      const { data, error } = await supabase
        .from("life_plans")
        .select("id, title, age_group, category, owner_type, status, priority, note, created_at, updated_at")
        .eq("list_id", SHARED_LIST_ID)
        .order("created_at", { ascending: false });

      if (error) throw error;
      state.plans = Array.isArray(data) ? data : [];
    }

    async function verifyMembership(user) {
      const { data, error } = await supabase
        .from("list_members")
        .select("id")
        .eq("list_id", SHARED_LIST_ID)
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) throw error;
      if (!data) throw new Error("このユーザーは共有リストのメンバーではありません。list_members を確認してください。");
    }

    async function reloadAllData(statusEl = null) {
      try {
        if (statusEl) setStatus(statusEl, "再読み込み中...");
        await Promise.all([loadPlaces(), loadPlans()]);
        renderAll();
        if (statusEl) setStatus(statusEl, "再読み込みしました。", "success");
      } catch (error) {
        if (statusEl) setStatus(statusEl, `再読み込みに失敗しました: ${error.message}`, "error");
        else console.error(error);
      }
    }

    async function handleSession() {
      try {
        setStatus(els.authStatus, "");
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        const session = data.session;
        if (!session?.user) {
          showLoggedOut();
          return;
        }
        await verifyMembership(session.user);
        showLoggedIn(session.user);
        els.otpPanel.classList.add("hidden");
        els.otpInput.value = "";
        state.pendingEmail = "";
        await reloadAllData();
      } catch (error) {
        showLoggedOut();
        setStatus(els.authStatus, `ログイン状態の確認に失敗しました: ${error.message}`, "error");
      }
    }

    async function sendOtpCode() {
      const email = els.emailInput.value.trim();
      if (!email) {
        setStatus(els.authStatus, "メールアドレスを入力してください。", "error");
        return;
      }
      els.loginBtn.disabled = true;
      setStatus(els.authStatus, "認証コードを送信中...");
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: true }
      });
      els.loginBtn.disabled = false;
      if (error) {
        setStatus(els.authStatus, `送信に失敗しました: ${error.message}`, "error");
        return;
      }
      state.pendingEmail = email;
      els.otpPanel.classList.remove("hidden");
      setStatus(els.authStatus, "認証コードを送信しました。", "success");
      els.otpInput.focus();
    }

    async function verifyOtpCode() {
      const email = els.emailInput.value.trim() || state.pendingEmail;
      const token = els.otpInput.value.trim();
      if (!email) {
        setStatus(els.authStatus, "先にメールアドレスを入力してください。", "error");
        return;
      }
      if (token.length < 8) {
        setStatus(els.authStatus, "8桁の認証コードを入力してください。", "error");
        return;
      }
      els.verifyBtn.disabled = true;
      setStatus(els.authStatus, "認証中...");
      const { error } = await supabase.auth.verifyOtp({ email, token, type: "email" });
      els.verifyBtn.disabled = false;
      if (error) {
        setStatus(els.authStatus, `認証に失敗しました: ${error.message}`, "error");
        return;
      }
      setStatus(els.authStatus, "ログインしました。", "success");
      await handleSession();
    }

    async function savePlace() {
      const name = els.placeNameInput.value.trim();
      const url = normalizeUrl(els.placeUrlInput.value);
      const category = els.placeCategoryInput.value;

      if (!state.user) {
        setStatus(els.placeStatus, "先にログインしてください。", "error");
        return;
      }
      if (!name) {
        setStatus(els.placeStatus, "店名・場所名を入力してください。", "error");
        return;
      }
      if (!url) {
        setStatus(els.placeStatus, "URLを入力してください。", "error");
        return;
      }
      try { new URL(url); } catch {
        setStatus(els.placeStatus, "URLの形式が正しくありません。", "error");
        return;
      }

      els.savePlaceBtn.disabled = true;
      setStatus(els.placeStatus, state.editingPlaceId ? "更新中..." : "保存中...");

      let error = null;
      if (state.editingPlaceId) {
        ({ error } = await supabase
          .from("items")
          .update({ name, url, category })
          .eq("id", state.editingPlaceId)
          .eq("list_id", SHARED_LIST_ID));
      } else {
        ({ error } = await supabase
          .from("items")
          .insert({ list_id: SHARED_LIST_ID, name, url, category, visited: false, created_by: state.user.id }));
      }

      els.savePlaceBtn.disabled = false;
      if (error) {
        setStatus(els.placeStatus, `保存に失敗しました: ${error.message}`, "error");
        return;
      }

      const wasEditing = !!state.editingPlaceId;
      resetPlaceForm();
      await reloadAllData();
      setStatus(els.placeStatus, wasEditing ? "更新しました。" : "保存しました。", "success");
    }

    async function savePlan() {
      const title = els.planTitleInput.value.trim();
      const age_group = els.planAgeInput.value;
      const category = els.planCategoryInput.value;
      const owner_type = els.planOwnerInput.value;
      const status = els.planStatusInput.value;
      const priority = Number(els.planPriorityInput.value);
      const note = els.planNoteInput.value.trim();

      if (!state.user) {
        setStatus(els.planStatus, "先にログインしてください。", "error");
        return;
      }
      if (!title) {
        setStatus(els.planStatus, "やりたいことを入力してください。", "error");
        return;
      }

      const payload = {
        list_id: SHARED_LIST_ID,
        title,
        age_group,
        category,
        owner_type,
        status,
        priority,
        note,
        created_by: state.user.id
      };

      els.savePlanBtn.disabled = true;
      setStatus(els.planStatus, state.editingPlanId ? "更新中..." : "保存中...");

      let error = null;
      if (state.editingPlanId) {
        const updatePayload = { ...payload };
        delete updatePayload.created_by;
        ({ error } = await supabase
          .from("life_plans")
          .update(updatePayload)
          .eq("id", state.editingPlanId)
          .eq("list_id", SHARED_LIST_ID));
      } else {
        ({ error } = await supabase.from("life_plans").insert(payload));
      }

      els.savePlanBtn.disabled = false;
      if (error) {
        setStatus(els.planStatus, `保存に失敗しました: ${error.message}`, "error");
        return;
      }

      const wasEditing = !!state.editingPlanId;
      resetPlanForm();
      await reloadAllData();
      setStatus(els.planStatus, wasEditing ? "更新しました。" : "保存しました。", "success");
    }

    function startPlaceEdit(id) {
      const item = state.places.find((row) => row.id === id);
      if (!item) return;
      state.editingPlaceId = id;
      els.placeNameInput.value = item.name || "";
      els.placeUrlInput.value = item.url || "";
      els.placeCategoryInput.value = item.category || "食";
      updateFormTitles();
      switchScreen("places");
      window.scrollTo({ top: 0, behavior: "smooth" });
      setStatus(els.placeStatus, "編集モードです。", "warning");
    }

    function startPlanEdit(id) {
      const item = state.plans.find((row) => row.id === id);
      if (!item) return;
      state.editingPlanId = id;
      els.planTitleInput.value = item.title || "";
      els.planAgeInput.value = item.age_group || "20代";
      els.planCategoryInput.value = item.category || "旅行";
      els.planOwnerInput.value = item.owner_type || "shared";
      els.planStatusInput.value = item.status || "idea";
      els.planPriorityInput.value = String(item.priority ?? 2);
      els.planNoteInput.value = item.note || "";
      updateFormTitles();
      switchScreen("plans");
      window.scrollTo({ top: 0, behavior: "smooth" });
      setStatus(els.planStatus, "編集モードです。", "warning");
    }

    async function toggleVisited(id, nextVisited) {
      setStatus(els.placeStatus, "更新中...");
      const { error } = await supabase
        .from("items")
        .update({ visited: nextVisited })
        .eq("id", id)
        .eq("list_id", SHARED_LIST_ID);
      if (error) {
        setStatus(els.placeStatus, `更新に失敗しました: ${error.message}`, "error");
        return;
      }
      await reloadAllData();
      setStatus(els.placeStatus, "更新しました。", "success");
    }

    function openDeleteModal(target) {
      state.deleteTarget = target;
      els.deleteModalText.textContent = `${target.kind === "place" ? "この行きたい場所" : "このライフプラン"}を削除しますか？`;
      els.deleteModal.classList.remove("hidden");
    }

    function closeDeleteModal() {
      state.deleteTarget = null;
      els.deleteModal.classList.add("hidden");
    }

    async function confirmDelete() {
      if (!state.deleteTarget) return;
      const { kind, id } = state.deleteTarget;
      const table = kind === "place" ? "items" : "life_plans";
      const statusEl = kind === "place" ? els.placeStatus : els.planStatus;
      setStatus(statusEl, "削除中...");
      const { error } = await supabase.from(table).delete().eq("id", id).eq("list_id", SHARED_LIST_ID);
      if (error) {
        setStatus(statusEl, `削除に失敗しました: ${error.message}`, "error");
        closeDeleteModal();
        return;
      }
      if (kind === "place" && state.editingPlaceId === id) resetPlaceForm();
      if (kind === "plan" && state.editingPlanId === id) resetPlanForm();
      await reloadAllData();
      setStatus(statusEl, "削除しました。", "success");
      closeDeleteModal();
    }

    function openFabModal() {
      els.fabModal.classList.remove("hidden");
    }

    function closeFabModal() {
      els.fabModal.classList.add("hidden");
    }

    function bindEvents() {
      els.loginBtn.addEventListener("click", sendOtpCode);
      els.verifyBtn.addEventListener("click", verifyOtpCode);
      els.emailInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendOtpCode(); });
      els.otpInput.addEventListener("keydown", (e) => { if (e.key === "Enter") verifyOtpCode(); });

      els.accountBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        els.accountMenu.classList.toggle("hidden");
      });
      els.accountMenu.addEventListener("click", (e) => e.stopPropagation());
      document.addEventListener("click", () => els.accountMenu.classList.add("hidden"));

      els.reloadBtn.addEventListener("click", async () => {
        els.accountMenu.classList.add("hidden");
        await reloadAllData(els.placeStatus);
      });

      els.logoutBtn.addEventListener("click", async () => {
        els.accountMenu.classList.add("hidden");
        const { error } = await supabase.auth.signOut();
        if (error) {
          setStatus(els.placeStatus, `ログアウトに失敗しました: ${error.message}`, "error");
          return;
        }
        showLoggedOut();
        setStatus(els.authStatus, "ログアウトしました。", "success");
      });

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchScreen(btn.dataset.screen));
      });

      els.fab.addEventListener("click", openFabModal);
      els.closeFabModalBtn.addEventListener("click", closeFabModal);
      els.fabModal.addEventListener("click", (e) => {
        if (e.target === els.fabModal) closeFabModal();
      });

      els.openPlaceFormBtn.addEventListener("click", () => {
        closeFabModal();
        switchScreen("places");
        window.scrollTo({ top: 0, behavior: "smooth" });
        els.placeNameInput.focus();
      });

      els.openPlanFormBtn.addEventListener("click", () => {
        closeFabModal();
        switchScreen("plans");
        window.scrollTo({ top: 0, behavior: "smooth" });
        els.planTitleInput.focus();
      });

      els.savePlaceBtn.addEventListener("click", savePlace);
      els.cancelPlaceEditBtn.addEventListener("click", () => {
        resetPlaceForm();
        setStatus(els.placeStatus, "編集をキャンセルしました。");
      });

      els.savePlanBtn.addEventListener("click", savePlan);
      els.cancelPlanEditBtn.addEventListener("click", () => {
        resetPlanForm();
        setStatus(els.planStatus, "編集をキャンセルしました。");
      });

      els.placeCategoryAllBtn.addEventListener("click", () => { state.placeCategoryFilter = "all"; renderPlaces(); });
      els.placeCategoryFoodBtn.addEventListener("click", () => { state.placeCategoryFilter = "食"; renderPlaces(); });
      els.placeCategoryTravelBtn.addEventListener("click", () => { state.placeCategoryFilter = "旅行"; renderPlaces(); });
      els.placeVisitWantBtn.addEventListener("click", () => { state.placeVisitFilter = "want"; renderPlaces(); });
      els.placeVisitDoneBtn.addEventListener("click", () => { state.placeVisitFilter = "done"; renderPlaces(); });

      document.querySelectorAll("[data-age-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.planAgeFilter = btn.dataset.ageFilter;
          renderPlans();
        });
      });

      document.querySelectorAll("[data-owner-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.planOwnerFilter = btn.dataset.ownerFilter;
          renderPlans();
        });
      });

      els.placesList.addEventListener("click", async (e) => {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        const editId = target.dataset.placeEdit;
        const toggleId = target.dataset.placeToggle;
        const deleteId = target.dataset.placeDelete;
        if (editId) startPlaceEdit(editId);
        if (toggleId) await toggleVisited(toggleId, target.dataset.nextVisited === "true");
        if (deleteId) openDeleteModal({ kind: "place", id: deleteId });
      });

      els.plansList.addEventListener("click", (e) => {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        const editId = target.dataset.planEdit;
        const deleteId = target.dataset.planDelete;
        if (editId) startPlanEdit(editId);
        if (deleteId) openDeleteModal({ kind: "plan", id: deleteId });
      });

      els.confirmDeleteBtn.addEventListener("click", confirmDelete);
      els.cancelDeleteBtn.addEventListener("click", closeDeleteModal);
      els.deleteModal.addEventListener("click", (e) => {
        if (e.target === els.deleteModal) closeDeleteModal();
      });

      supabase.auth.onAuthStateChange((_event, session) => {
        if (session?.user) {
          handleSession();
        } else {
          showLoggedOut();
        }
      });
    }

    async function init() {
      bindEvents();
      switchScreen("places");
      resetPlaceForm();
      resetPlanForm();
      updatePlaceFilterTabs();
      updatePlanFilterTabs();
      renderAll();
      await handleSession();
    }

    init();
  </script>
</body>
</html>
